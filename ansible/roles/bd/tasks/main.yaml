- name: Instalar MariaDB y el conector de Python
  ansible.builtin.apt:
    name: [mariadb-server, python3-pymysql]
    state: present

- name: MariaDB escucha solo en la red de datos
  ansible.builtin.template:
    src: red-datos.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-red-datos.cnf
    mode: "0644"
  notify: Reiniciar MariaDB

- name: MariaDB arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Crear usuario que solo conecta desde el servidor web
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ ip_datos_web }}"
    priv: "{{ db_name }}.*:SELECT,INSERT"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Copiar schema.sql
  ansible.builtin.copy:
    src: schema.sql
    dest: /opt/guestbook-schema.sql
    mode: "0644"

- name: Comprobar si la tabla ya existe
  ansible.builtin.command: mysql -N -e "SHOW TABLES LIKE '{{ db_tabla }}'" {{ db_name }}
  register: tabla
  changed_when: false

- name: Crear las tablas (solo la primera vez)
  ansible.builtin.shell: mysql {{ db_name }} < /opt/guestbook-schema.sql
  when: tabla.stdout | length == 0
