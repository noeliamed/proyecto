- name: Forzar IPv4 en apt (la red NAT no tiene IPv6)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-ipv4
    content: 'Acquire::ForceIPv4 "true";'
    mode: "0644"

- name: Actualizar índice de paquetes y sistema
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Instalar paquetes comunes
  ansible.builtin.apt:
    name: "{{ paquetes_comunes }}"
    state: present
