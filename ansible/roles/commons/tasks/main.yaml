- name: Actualizar índice de paquetes y sistema
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Instalar paquetes comunes
  ansible.builtin.apt:
    name: "{{ paquetes_comunes }}"
    state: present

- name: Instalar Apache y PHP
  ansible.builtin.apt:
    name: [apache2, php, libapache2-mod-php, php-mysql, php-mbstring, git, mariadb-client]
    state: present

- name: Instalar utilidades de disco
  ansible.builtin.apt:
    name: [parted, xfsprogs]
    state: present

- name: Crear el grupo mysql antes de instalar MariaDB
  ansible.builtin.group:
    name: mysql
    system: true

- name: Crear el usuario mysql antes de instalar MariaDB
  ansible.builtin.user:
    name: mysql
    group: mysql
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Crear la partición
  community.general.parted:
    device: "{{ disco_datos_dispositivo }}"
    number: 1
    label: gpt
    part_type: primary
    part_start: 1MiB
    part_end: 100%
    state: present

- name: Esperar a que aparezca la partición
  ansible.builtin.wait_for:
    path: "{{ disco_datos_particion }}"
    timeout: 30

- name: Formatear
  community.general.filesystem:
    dev: "{{ disco_datos_particion }}"
    fstype: "{{ disco_datos_fstype }}"
    opts: "-L {{ disco_datos_etiqueta }}"

- name: Crear el punto de montaje
  ansible.builtin.file:
    path: "{{ disco_datos_montaje }}"
    state: directory

- name: Montar de forma persistente
  ansible.posix.mount:
    path: "{{ disco_datos_montaje }}"
    src: "LABEL={{ disco_datos_etiqueta }}"
    fstype: "{{ disco_datos_fstype }}"
    opts: defaults
    state: mounted

- name: Propietario del punto de montaje
  ansible.builtin.file:
    path: "{{ disco_datos_montaje }}"
    owner: mysql
    group: mysql
    mode: "0755"

- name: Grupo SFTP
  ansible.builtin.group:
    name: "{{ sftp_grupo }}"

- name: Directorio raíz de las jaulas
  ansible.builtin.file:
    path: "{{ sftp_raiz }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Usuarios SFTP
  ansible.builtin.user:
    name: "{{ item.nombre }}"
    group: "{{ sftp_grupo }}"
    shell: /usr/sbin/nologin
  loop: "{{ sftp_usuarios }}"

- name: Clave pública de cada usuario
  ansible.posix.authorized_key:
    user: "{{ item.nombre }}"
    key: "{{ item.clave }}"
  loop: "{{ sftp_usuarios }}"

- name: Jaula de cada usuario (de root, sin escritura)
  ansible.builtin.file:
    path: "{{ sftp_raiz }}/{{ item.nombre }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ sftp_usuarios }}"

- name: Directorio de subida
  ansible.builtin.file:
    path: "{{ sftp_raiz }}/{{ item.nombre }}/subidas"
    state: directory
    owner: "{{ item.nombre }}"
    group: "{{ sftp_grupo }}"
    mode: "0750"
  loop: "{{ sftp_usuarios }}"

- name: Configuración de sshd para el grupo SFTP
  ansible.builtin.template:
    src: sftp.conf.j2
    dest: /etc/ssh/sshd_config.d/50-sftp.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recargar ssh
