- name: Instalar cliente NFS
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Crear directorio de montaje NFS
  ansible.builtin.file:
    path: "{{ nfs_punto_montaje }}"
    state: directory

- name: Montar exportación NFS de forma persistente
  ansible.posix.mount:
    src: "{{ nfs_servidor }}:{{ nfs_exportacion }}"
    path: "{{ nfs_punto_montaje }}"
    fstype: nfs
    opts: rw,_netdev,nofail
    state: mounted
